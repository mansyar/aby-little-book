# Static SPA configuration for the unprivileged Nginx runtime.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    # 3D delivery: GLB scenes and KTX2 textures need explicit types because
    # the default mime.types map omits them. A server-level types block
    # replaces the http-level map, so re-include the defaults here alongside
    # the additions. Versioned 3D packages ship under /assets with content
    # hashes, so the immutable rule below covers them.
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        image/ktx2 ktx2;
    }

    # Health and version identity: never cached.
    location = /healthz {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
        access_log off;
    }

    location = /version.json {
        add_header Cache-Control "no-store";
        include /etc/nginx/security-headers.conf;
    }

    # Hashed build assets and local fonts: immutable and long-lived.
    location ~ ^/(assets|fonts)/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # The application shell revalidates so updates reach readers.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Everything else falls back to the application shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
